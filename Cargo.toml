[workspace]
resolver = "2"
members = [
  "crates/rosetta-core",
  "crates/rosetta-glossary",
  "crates/rosetta-atlas",
  "crates/rosetta-cli",
  "crates/rosetta-mcp",
  "crates/rosetta-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/angusbezzina/rosetta"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.7"
clap = { version = "4.5", features = ["derive", "cargo", "env", "wrap_help"] }
glob = "0.3"
getrandom = "0.4"
regex = "1.10"
rayon = "1.12.0"
rmcp = { version = "3.7.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
toml = "0.8"
tree-sitter = "0.22.6"
tree-sitter-python = "0.21.0"
tree-sitter-rust = "0.21.2"
tree-sitter-typescript = "0.21.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
